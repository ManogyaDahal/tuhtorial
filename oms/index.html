<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OMS - Order Management System</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f1117; color: #e1e4e8; padding: 2rem; }
    h1 { margin-bottom: 1.5rem; font-size: 1.5rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; max-width: 800px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.25rem; }
    .card h2 { font-size: 1rem; margin-bottom: 1rem; color: #58a6ff; }
    label { display: block; font-size: 0.8rem; color: #8b949e; margin-bottom: 0.25rem; }
    input { width: 100%; padding: 0.5rem; border: 1px solid #30363d; border-radius: 4px; background: #0d1117; color: #e1e4e8; font-size: 0.9rem; margin-bottom: 0.75rem; }
    input:focus { outline: none; border-color: #58a6ff; }
    button { width: 100%; padding: 0.5rem; border: none; border-radius: 4px; background: #238636; color: #fff; font-size: 0.9rem; cursor: pointer; }
    button:hover { background: #2ea043; }
    .result { margin-top: 1rem; padding: 0.75rem; border-radius: 4px; background: #0d1117; border: 1px solid #30363d; font-family: monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; min-height: 2.5rem; color: #8b949e; }
    .result.success { color: #3fb950; border-color: #238636; }
    .result.error { color: #f85149; border-color: #da3633; }
  </style>
</head>
<body>
  <h1>Order Management System</h1>
  <div class="grid">
    <div class="card">
      <h2>Orders Service (Direct &mdash; :8000)</h2>
      <label for="o-cid">Customer ID</label>
      <input id="o-cid" type="number" value="1" />
      <label for="o-pid">Product ID</label>
      <input id="o-pid" type="number" value="1" />
      <label for="o-qty">Quantity</label>
      <input id="o-qty" type="number" value="1" />
      <button onclick="sendOrder('orders')">Create Order</button>
      <div id="o-result" class="result"></div>
    </div>
    <div class="card">
      <h2>Kitchen Service (via gRPC &mdash; :8001)</h2>
      <label for="k-cid">Customer ID</label>
      <input id="k-cid" type="number" value="1" />
      <label for="k-pid">Product ID</label>
      <input id="k-pid" type="number" value="1" />
      <label for="k-qty">Quantity</label>
      <input id="k-qty" type="number" value="1" />
      <button onclick="sendOrder('kitchen')">Create Order</button>
      <div id="k-result" class="result"></div>
    </div>
  </div>

  <script>
    const ports = { orders: 8000, kitchen: 8001 };

    async function sendOrder(service) {
      const prefix = service === 'orders' ? 'o' : 'k';
      const customerId = parseInt(document.getElementById(`${prefix}-cid`).value) || 0;
      const productId  = parseInt(document.getElementById(`${prefix}-pid`).value) || 0;
      const quantity   = parseInt(document.getElementById(`${prefix}-qty`).value) || 0;
      const resultEl  = document.getElementById(`${prefix}-result`);

      resultEl.className = 'result';
      resultEl.textContent = 'Sending...';

      try {
        const res = await fetch(`http://localhost:${ports[service]}/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customerId, productId, quantity }),
        });
        const data = await res.json();
        resultEl.textContent = JSON.stringify(data, null, 2);
        resultEl.className = res.ok ? 'result success' : 'result error';
      } catch (err) {
        resultEl.textContent = err.message;
        resultEl.className = 'result error';
      }
    }
  </script>
</body>
</html>
